services:
  app:
    build:
      context: .
      target: development
    init: true
    ports:
      - "5173:5173"
    volumes:
      # Host edits are watched; the container cannot modify source files.
      - type: bind
        source: .
        target: /app
        read_only: true
      # Linux dependencies always mask any host node_modules (macOS/Windows).
      - node_modules:/app/node_modules
      - npm_cache:/home/node/.npm
      # Builds run inside development never write dist to the host.
      - /app/dist
    # Synchronize persistent dependencies with the lockfile on every start.
    command: sh -c "npm ci --no-audit --no-fund && exec npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3

  production:
    profiles: [production]
    build:
      context: .
      target: production
    ports:
      - "8080:80"

volumes:
  node_modules:
  npm_cache:
